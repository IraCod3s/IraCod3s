<svg xmlns="http://www.w3.org/2000/svg" width="900" height="459" viewBox="0 0 900 459" role="img" aria-label="Ira, Dev Dashboard. Ira Verma, Computer Science and Engineering student at Chitkara University, Khanna, Punjab, India">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9ad7f5"/><stop offset=".22" stop-color="#4aa8e0"/><stop offset=".5" stop-color="#17426b"/><stop offset="1" stop-color="#06101c"/></linearGradient>
<radialGradient id="glow" cx=".3" cy=".05" r=".7"><stop offset="0" stop-color="#e4f6ff" stop-opacity=".5"/><stop offset="1" stop-color="#e4f6ff" stop-opacity="0"/></radialGradient>
<pattern id="dw" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.35" fill="#f4fbff"/></pattern>
<pattern id="dt" width="4" height="4" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.35" fill="#e0f3ff"/></pattern>
<linearGradient id="fl" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#121a24"/><stop offset="1" stop-color="#121a24" stop-opacity="0"/></linearGradient>
<linearGradient id="fr" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#121a24" stop-opacity="0"/><stop offset="1" stop-color="#121a24"/></linearGradient>
<filter id="sh" x="-8%" y="-8%" width="116%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="4.5" flood-color="#000" flood-opacity=".5"/></filter>
<clipPath id="cv"><rect width="900" height="814" rx="26"/></clipPath>
<clipPath id="mq"><rect x="1" y="44" width="838" height="90"/></clipPath>
</defs>
<style>
text{font-family:'SF Mono','JetBrains Mono','Fira Code',Menlo,Consolas,'Courier New',monospace}
.l{font-size:9.5px;fill:#7f93a8;letter-spacing:1.2px}
.s{font-size:9px;fill:#7f93a8;letter-spacing:1px}
.spin{transform-box:fill-box;transform-origin:50% 50%;animation:sp 40s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.blink{animation:bk 1.2s steps(1) infinite}
@keyframes bk{50%{opacity:.15}}
.mq{animation:mq 40s linear infinite}
@keyframes mq{to{transform:translateX(-2106px)}}
@media (prefers-reduced-motion:reduce){.spin,.blink,.mq{animation:none}}
</style>
<g clip-path="url(#cv)"><rect width="900" height="814" fill="url(#bg)"/><rect width="900" height="814" fill="url(#glow)"/></g>
<text x="44" y="84" font-size="58" font-weight="900" letter-spacing="5" fill="url(#dw)">IRA</text><text x="44" y="124" font-size="27" font-weight="900" letter-spacing="3" fill="url(#dt)">DEV DASHBOARD</text><g transform="translate(30,160)"><rect width="840" height="284" rx="18" fill="#121a24" stroke="#223446" filter="url(#sh)"/><text x="18" y="28" class="l">01  ABOUT ME</text><text x="30" y="64" font-size="13" xml:space="preserve"><tspan fill="#ecf6ff" font-weight="400">Hey there, I'm </tspan><tspan fill="#38bdf8" font-weight="800">Ira Verma</tspan><tspan fill="#ecf6ff" font-weight="400"> 👋, a Computer Science &amp; Engineering student at</tspan></text><text x="30" y="85" font-size="13" xml:space="preserve"><tspan fill="#38bdf8" font-weight="800">Chitkara University</tspan><tspan fill="#ecf6ff" font-weight="400">, based in Khanna, Punjab, India.</tspan></text><text x="30" y="118" font-size="13" xml:space="preserve"><tspan fill="#ecf6ff" font-weight="400">I enjoy turning ideas into clean, fast and thoughtful web experiences.</tspan></text><text x="30" y="139" font-size="13" xml:space="preserve"><tspan fill="#ecf6ff" font-weight="400">My strength is </tspan><tspan fill="#38bdf8" font-weight="800">front-end web engineering</tspan><tspan fill="#ecf6ff" font-weight="400">, backed by solid fundamentals</tspan></text><text x="30" y="160" font-size="13" xml:space="preserve"><tspan fill="#ecf6ff" font-weight="400">in </tspan><tspan fill="#38bdf8" font-weight="800">Object-Oriented Programming with Java</tspan><tspan fill="#ecf6ff" font-weight="400"> and </tspan><tspan fill="#38bdf8" font-weight="800">data structures</tspan><tspan fill="#ecf6ff" font-weight="400">.</tspan></text><text x="30" y="181" font-size="13" xml:space="preserve"><tspan fill="#ecf6ff" font-weight="400">I'm always learning and always shipping.</tspan></text><text x="30" y="214" font-size="13" xml:space="preserve"><tspan fill="#ecf6ff" font-weight="400">This profile is my little corner of the internet: a home for my</tspan></text><text x="30" y="235" font-size="13" xml:space="preserve"><tspan fill="#ecf6ff" font-weight="400">academic coursework, exam preparation notes and the modern web apps I</tspan></text><text x="30" y="256" font-size="13" xml:space="preserve"><tspan fill="#ecf6ff" font-weight="400">build along the way. If something catches your eye, say hi! 🚀</tspan></text><line x1="648" y1="26" x2="648" y2="258" stroke="#223446"/><g class="spin"><circle cx="744.0" cy="54.0" r="1.7" fill="#38bdf8"/><circle cx="748.7" cy="54.2" r="1.7" fill="#38bdf8"/><circle cx="753.3" cy="54.9" r="1.7" fill="#d3e6f5"/><circle cx="757.8" cy="56.1" r="1.7" fill="#d3e6f5"/><circle cx="762.1" cy="57.7" r="1.7" fill="#d3e6f5"/><circle cx="766.3" cy="59.8" r="1.7" fill="#d3e6f5"/><circle cx="770.3" cy="62.2" r="1.7" fill="#d3e6f5"/><circle cx="774.0" cy="65.1" r="1.7" fill="#d3e6f5"/><circle cx="777.3" cy="68.3" r="1.7" fill="#d3e6f5"/><circle cx="780.4" cy="71.8" r="1.7" fill="#d3e6f5"/><circle cx="783.0" cy="75.7" r="1.7" fill="#d3e6f5"/><circle cx="785.3" cy="79.7" r="1.7" fill="#d3e6f5"/><circle cx="787.1" cy="84.0" r="1.7" fill="#d3e6f5"/><circle cx="788.5" cy="88.5" r="1.7" fill="#d3e6f5"/><circle cx="789.5" cy="93.0" r="1.7" fill="#d3e6f5"/><circle cx="789.9" cy="97.7" r="1.7" fill="#d3e6f5"/><circle cx="789.9" cy="102.3" r="1.7" fill="#d3e6f5"/><circle cx="789.5" cy="107.0" r="1.7" fill="#d3e6f5"/><circle cx="788.5" cy="111.5" r="1.7" fill="#d3e6f5"/><circle cx="787.1" cy="116.0" r="1.7" fill="#d3e6f5"/><circle cx="785.3" cy="120.3" r="1.7" fill="#d3e6f5"/><circle cx="783.0" cy="124.3" r="1.7" fill="#d3e6f5"/><circle cx="780.4" cy="128.2" r="1.7" fill="#d3e6f5"/><circle cx="777.3" cy="131.7" r="1.7" fill="#d3e6f5"/><circle cx="774.0" cy="134.9" r="1.7" fill="#d3e6f5"/><circle cx="770.3" cy="137.8" r="1.7" fill="#d3e6f5"/><circle cx="766.3" cy="140.2" r="1.7" fill="#d3e6f5"/><circle cx="762.1" cy="142.3" r="1.7" fill="#d3e6f5"/><circle cx="757.8" cy="143.9" r="1.7" fill="#d3e6f5
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 336" width="900" height="336" role="img" aria-label="profile.conf"><title>profile.conf</title><style>
text{font-family:'Fira Code','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace}
.bob{animation:bob 2.6s ease-in-out infinite}
.walk{animation:walk 4.2s ease-in-out infinite alternate}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.n1{animation:fl 3s ease-in-out infinite}
.n2{animation:fl 3.6s ease-in-out .8s infinite}
.n3{animation:fl 2.8s ease-in-out 1.4s infinite}
.cur{animation:cur 1s steps(1) infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes walk{0%{transform:translateX(-26px)}100%{transform:translateX(26px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes fl{0%,100%{transform:translateY(0);opacity:.55}50%{transform:translateY(-7px);opacity:1}}
@keyframes cur{0%,100%{opacity:1}50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
